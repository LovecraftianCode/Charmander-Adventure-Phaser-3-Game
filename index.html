<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charmander Adventure</title>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.14.0/dist/phaser.min.js"></script>
    <script src="game.js"></script>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">
            🔥 <span>Charmander</span> Adventure
        </h1>
        
        <!-- Contenedor del juego -->
        <div id="game"></div>
        
        <p class="game-instructions">
            🎮 Usa las <span class="arrow-keys">flechas</span> para mover a Charmander · 
            Recolecta las <span class="key">🪙</span> monedas
        </p>
    </div>
</body>
</html>
